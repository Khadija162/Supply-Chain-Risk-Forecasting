services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./models:/app/models:ro"]
    environment:
      MODEL_PATH: /app/models/risk_model.joblib
  dashboard:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
